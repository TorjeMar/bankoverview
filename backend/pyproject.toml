[project]
name = "personal-finance-backend"
version = "0.1.0"
description = "FastAPI backend for a personal finance dashboard using Open Banking"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.16",
    "asyncpg>=0.30",
    "authlib>=1.8.0",
    "fastapi>=0.140.0",
    "httpx>=0.28",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]>=2.13.0",
    "python-multipart>=0.0.32",
    "requests>=2.34.2",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=6.2",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
# app.database's async engine is a module-level global, created once under
# whatever event loop is active at import time — the default per-test loop
# scope tears that loop down after each test and the next test's asyncpg
# connections end up "attached to a different loop". One shared loop for
# the whole run matches how the engine is actually used in production.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
